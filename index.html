<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seal Island Economy Adventure</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #071d2a; color: #f7fbff; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; background: #0b5875; }
    .hud { position: fixed; inset: 14px auto auto 14px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
    .panel { background: rgba(5, 18, 28, .82); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 8px 26px rgba(0,0,0,.3); border-radius: 10px; backdrop-filter: blur(6px); }
    .stats { padding: 10px 12px; min-width: 260px; line-height: 1.45; }
    .stats b { color: #ffe38a; }
    .tools { position: fixed; top: 14px; right: 14px; width: 170px; padding: 10px; pointer-events: auto; }
    button { appearance: none; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: linear-gradient(#1e5d75,#123848); color: #fff; padding: 8px 10px; font-weight: 700; cursor: pointer; box-shadow: inset 0 1px rgba(255,255,255,.16); }
    button:hover { filter: brightness(1.15); }
    button.active { background: linear-gradient(#f0a73a,#a86619); color: #1d1000; }
    .tools button { width: 100%; margin: 4px 0; text-align: left; }
    .bottom { position: fixed; left: 14px; bottom: 14px; right: 14px; display: grid; grid-template-columns: 260px 1fr; gap: 10px; pointer-events: none; }
    .help { padding: 10px 12px; font-size: 13px; line-height: 1.55; }
    .sealCards { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 10px; }
    .sealCard { padding: 10px 12px; min-height: 118px; }
    .bar { height: 9px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; margin: 4px 0 8px; }
    .fill { height: 100%; background: linear-gradient(90deg,#79e54c,#16b15e); }
    .log { margin-top: 8px; font-size: 13px; max-height: 115px; overflow: hidden; color: #d7efff; }
    .start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, rgba(23,112,145,.82), rgba(2,12,22,.96)); pointer-events: auto; }
    .startCard { width: min(620px, calc(100vw - 36px)); padding: 30px; text-align: center; }
    .startCard h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 56px); }
    .startCard p { color: #cdefff; line-height: 1.7; }
    .startActions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .saveInfo { margin-top: 10px; color: #cdefff; font-size: 13px; line-height: 1.55; }
    .savePanel { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.16); color: #cdefff; font-size: 13px; line-height: 1.45; }
    .savePanel button { width: 100%; margin-top: 8px; text-align: center; }
    .zoomBtns { display: flex; gap: 6px; margin-top: 8px; pointer-events: auto; }
    .zoomBtns button { width: 42px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="panel stats" id="stats"></div>
  </div>

  <div class="panel tools" id="tools"></div>

  <div class="bottom">
    <div class="panel help">
      <b>操作</b><br>
      WASD/矢印: カメラ移動<br>
      ドラッグ: カメラ移動 / 短いクリック: 配置<br>
      ホイール: ズーム<br>
      R: 施設入口を回転<br>開拓: 未開拓の草木岩をGで除去<br>
      <div class="zoomBtns"><button id="zoomOut">−</button><button id="zoomIn">＋</button></div>
    </div>
    <div class="sealCards" id="sealCards"></div>
  </div>

  <div class="start" id="startScreen">
    <div class="panel startCard">
      <h1>あざらし島の冒険経済</h1>
      <p>同じ世界マップ上にある島と外海を眺めながら、道路や施設を配置しましょう。あざらしたちは外でカニと戦い、Gを持ち帰り、施設で使い、倒れた仲間を救助し続けます。</p>
      <div class="startActions">
        <button id="startBtn">新しく始める</button>
        <button id="loadBtn" hidden>続きから</button>
      </div>
      <div class="saveInfo" id="startSaveInfo">セーブデータを確認中...</div>
    </div>
  </div>

<script>
'use strict';

const CONFIG = Object.freeze({
  canvas: { minDevicePixelRatio: 1, maxDevicePixelRatio: 2 },
  phase: { start: 'start', playing: 'playing', gameover: 'gameover' },
  world: { cols: 54, rows: 34, tile: 44, islandX: 4, islandY: 10, islandW: 28, islandH: 18, coastX: 34, coastY: 5, coastW: 16, coastH: 24, safeX: 14, safeY: 18 },
  expansion: { startX: 6, startY: 12, startW: 18, startH: 12, regionX: 5, regionY: 11, regionW: 26, regionH: 16, clearCost: 120, clearRadius: 1, obstacleSeedA: 17, obstacleSeedB: 31, obstacleModulo: 10, grassLimit: 4, treeLimit: 7 },
  tileState: { terrainWater: 'water', terrainLand: 'land', terrainOutside: 'outside', buildBlocked: 'blocked', buildable: 'buildable', obstacleGrass: 'grass', obstacleTree: 'tree', obstacleRock: 'rock' },
  village: { roadY: 16, roadX: 14, roadStartX: 7, roadEndX: 24, roadStartY: 16, roadEndY: 24, defaults: [
    { type: 'inn', x: 8, y: 14, directionIndex: 2 },
    { type: 'restaurant', x: 14, y: 14, directionIndex: 2 },
    { type: 'blacksmith', x: 20, y: 14, directionIndex: 2 },
    { type: 'flower', x: 13, y: 14 }, { type: 'tree', x: 8, y: 13 }, { type: 'rock', x: 19, y: 14 },
    { type: 'tree', x: 6, y: 13 }, { type: 'flower', x: 12, y: 18 }, { type: 'rock', x: 18, y: 18 }
  ] },
  camera: { x: 240, y: 280, zoom: 0.86, minZoom: 0.45, maxZoom: 1.8, panSpeed: 520, wheelStep: 0.1, buttonStep: 0.16, dragButton: 0 },
  SAVE_KEY: 'seal-island-economy-save',
  SAVE_VERSION: 3,
  AUTO_SAVE_INTERVAL_MS: 30000,
  MAX_LOGS: 7,
  resident: { defaultName: '島のあざらし' },
  knownness: { initial: 0, monthDays: 30, dayIntervalMs: 12000, huntRewardPerMonthlyHunt: 4, monthlyBaseReward: 2, satisfyingVisitReward: 3, unlockTargetId: 'visitor-tategoto' },
  movement: { roadCost: 1, buildableCost: 4, outsideCost: 5, gateCost: 1, maxPathNodes: 2500, pathReachDistance: 8, fallbackWarnCooldownMs: 60000 },
  timing: { targetFps: 60, maxDt: 0.05, uiMs: 120 },
  placement: { roadSize: 1, decorationSize: 1, facilitySize: 2, feedbackSeconds: 0.75 },
  directions: [ { name: 'N', dx: 0, dy: -1 }, { name: 'E', dx: 1, dy: 0 }, { name: 'S', dx: 0, dy: 1 }, { name: 'W', dx: -1, dy: 0 } ],
  tools: [
    { id: 'road', label: '🟫 道路', kind: 'road', w: 1, h: 1 },
    { id: 'inn', label: '🏨 宿屋', kind: 'facility', w: 2, h: 2 },
    { id: 'restaurant', label: '🍲 食堂', kind: 'facility', w: 2, h: 2 },
    { id: 'blacksmith', label: '⚒️ 鍛冶屋', kind: 'facility', w: 2, h: 2 },
    { id: 'flower', label: '🌼 花', kind: 'decoration', w: 1, h: 1 },
    { id: 'tree', label: '🌲 木', kind: 'decoration', w: 1, h: 1 },
    { id: 'rock', label: '🪨 岩', kind: 'decoration', w: 1, h: 1 },
    { id: 'clear', label: '⛏️ 開拓', kind: 'clear', w: 1, h: 1 },
    { id: 'delete', label: '❌ 削除', kind: 'delete', w: 1, h: 1 }
  ],
  facilities: {
    inn: { label: '宿屋', fee: 36, healPerSecond: 20, color: '#2f7eb5', bonusDecoration: 'tree', bonusRate: 0.05 },
    restaurant: { label: '食堂', spendPerVisit: 45, color: '#d66b2b', bonusDecoration: 'flower', bonusRate: 0.05 },
    blacksmith: { label: '鍛冶屋', spendPerVisit: 65, color: '#7d6043', bonusDecoration: 'rock', bonusRate: 0.05 }
  },
  gates: { entryGate: { id: 'entry_south', x: 14, y: 24 }, huntGates: [ { id: 'coast_gate', village: { x: 24, y: 16 }, outside: { x: 34, y: 16 }, areaId: 'coast' } ] },
  visitor: { maxActive: 2, spawnInterval: 16, spawnIntervalFavorReduction: 0.04, minSpawnIntervalMultiplier: 0.55, returnBaseWeight: 1, returnFavorWeight: 0.18, inactiveWeightBonus: 3, safeLeaveFavor: 2, minStayMs: 45000, maxStayMs: 110000, maxStayFavorBonusMs: 25000, maxStayFavorMsPerFavor: 1000, satisfyingMinFacilities: 1, satisfyingMinHunts: 1, enoughHuntsForLeave: 2, profiles: [
    { id: 'visitor-goma', name: 'ゴマ', personality: 'balanced', unlockedAtKnownness: 0, baseStats: { maxHp: 130, attack: 18, defense: 5 }, favor: 0, visits: 0, level: 1, exp: 0 },
    { id: 'visitor-kurakake', name: 'クラカケ', personality: 'cautious', unlockedAtKnownness: 0, baseStats: { maxHp: 120, attack: 17, defense: 6 }, favor: 0, visits: 0, level: 1, exp: 0 },
    { id: 'visitor-tategoto', name: 'タテゴト', personality: 'brave', unlockedAtKnownness: 100, baseStats: { maxHp: 145, attack: 20, defense: 5 }, favor: 0, visits: 0, level: 1, exp: 0 }
  ] },
  personalities: { cautious: { label: '慎重', returnHpRatio: 0.50, emergencyHpRatio: 0.25, preferredMinHunts: 1, maxHuntsPerTrip: 2, returnChance: 0.45 }, balanced: { label: '普通', returnHpRatio: 0.35, emergencyHpRatio: 0.20, preferredMinHunts: 2, maxHuntsPerTrip: 3, returnChance: 0.30 }, brave: { label: '勇敢', returnHpRatio: 0.25, emergencyHpRatio: 0.12, preferredMinHunts: 3, maxHuntsPerTrip: 5, returnChance: 0.18 } },
  seal: { maxHp: 130, attack: 18, defense: 5, baseSpeed: 50, roadSpeedMultiplier: 1.55, lowHpRatio: 0.4, innHpThreshold: 0.45, mediumHpRatio: 0.72, mediumInnChance: 0.35, mealsBeforeInnSoftLimit: 2, mealsInnChanceBoost: 0.35, fallenRecoveryPerSecond: 3, standHpRatio: 0.36, restTargetRatio: 0.88, contactDistance: 15, rescueScanDistance: 380, spendSeconds: 1.4, restSeconds: 1, startG: 0, spread: 24, huntDurationLimit: 42, noMonsterExploreSeconds: 8, favorHuntDurationBonus: 0.35, maxFavorHuntDurationBonus: 8, carriedGReturnThreshold: 56, carriedGReturnChance: 0.35, wanderSeconds: 2.5, levelExp: 48, levelHpGain: 10, levelAttackGain: 2, favorDefeat: 2, favorLevelUp: 4, favorFacilityUse: 1, favorRescued: 3, facilityChoiceWeights: { inn: 1.2, restaurant: 1.0, blacksmith: 0.8 }, blacksmithAttackChance: 0.45, blacksmithAttackGain: 1 },
  monster: { cap: 7, spawnInterval: 2.4, hp: 64, attack: 13, defense: 3, rewardG: 28, rewardExp: 16, contactDistance: 18 },
  combat: { sealAttackSeconds: 0.75, monsterAttackSeconds: 1.0, minDamage: 1 },
  render: { gridLine: 'rgba(255,255,255,.13)', island: '#79b85c', buildableLand: '#8dcc68', blockedLand: '#4e7f3d', outside: '#1b90a9', water: '#126d8b', beach: '#d9c887', boundary: 'rgba(255,255,255,.46)', road: '#b28a56', invalid: 'rgba(255,50,50,.45)', valid: 'rgba(80,255,140,.35)', shadow: 'rgba(0,0,0,.24)', font: '13px system-ui', bigFont: '18px system-ui', minimapW: 220, minimapH: 128, boundaryDash: 0.35, boundaryGap: 0.18, boundaryLine: 3, obstacle: { center: 0.5, shadowX: 2, shadowY: 10, shadowW: 14, shadowH: 6, grassLine: 3, grassBaseY: 10, grassReachX: 13, grassTipY: -2, grassReachY: 8, trunkX: 4, trunkY: 0, trunkW: 8, trunkH: 15, treeRadius: 15, treeY: -5, rockY: 4, rockW: 15, rockH: 11, rockTilt: -0.35 } }
});

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const toolsEl = document.getElementById('tools');
const sealCardsEl = document.getElementById('sealCards');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');
const loadBtn = document.getElementById('loadBtn');
const startSaveInfoEl = document.getElementById('startSaveInfo');

const gameState = createNewGameState();

function createNewGameState() {
  return {
    phase: CONFIG.phase.start,
    player: { g: 0 },
    residentName: CONFIG.resident.defaultName,
    camera: { x: CONFIG.camera.x, y: CONFIG.camera.y, zoom: CONFIG.camera.zoom, dragging: false, dragMoved: false, dragStartX: 0, dragStartY: 0, lastMouseX: 0, lastMouseY: 0 },
    input: { keys: {}, mouseWorld: { x: 0, y: 0 }, mouseTile: { x: -1, y: -1 } },
    ui: { selectedTool: 'road', directionIndex: 2, placementFeedback: null, lastUiUpdate: 0, needsHudUpdate: true },
    world: { tiles: [], roads: [], objects: [], nextObjectId: 1 },
    gates: cloneSerializable(CONFIG.gates, { entryGate: null, huntGates: [] }),
    seals: [],
    visitorProfiles: createDefaultVisitorProfiles(),
    monsters: [],
    images: {},
    logs: [],
    timers: { spawn: 0, monsterSpawn: 0, visitorSpawn: 0, ui: 0, day: 0 },
    save: { autoSaveTimerMs: 0, lastSavedAt: null, statusText: '' },
    village: { knownness: CONFIG.knownness.initial },
    calendar: { day: 1, month: 1 },
    stats: { monthlyHunts: 0 },
    frameTemps: { occupied: new Set(), usableFacilities: [], toRemoveMonsters: [] },
    lastTime: performance.now()
  };
}


function createDefaultVisitorProfiles() {
  return (CONFIG.visitor?.profiles ?? []).map(profile => ({
    id: String(profile?.id ?? ''),
    name: String(profile?.name ?? CONFIG.resident.defaultName),
    personality: String(profile?.personality ?? 'balanced'),
    unlockedAtKnownness: safeFiniteNumber(profile?.unlockedAtKnownness, 0, 0),
    baseStats: cloneSerializable(profile?.baseStats, { maxHp: CONFIG.seal.maxHp, attack: CONFIG.seal.attack, defense: CONFIG.seal.defense }),
    level: clampInteger(profile?.level, 1, Number.MAX_SAFE_INTEGER, 1),
    exp: safeFiniteNumber(profile?.exp, 0, 0),
    favor: safeFiniteNumber(profile?.favor, 0, 0),
    visits: clampInteger(profile?.visits, 0, Number.MAX_SAFE_INTEGER, 0),
    unlocked: safeFiniteNumber(profile?.unlockedAtKnownness, 0, 0) <= CONFIG.knownness.initial
  }));
}

function cloneSerializable(value, fallback) {
  try {
    const copy = JSON.parse(JSON.stringify(value));
    return copy ?? fallback;
  } catch (error) {
    return fallback;
  }
}

function getSerializableGameState() {
  const objects = Array.isArray(gameState.world?.objects) ? gameState.world.objects : [];
  return {
    phase: CONFIG.phase.playing,
    player: { g: safeFiniteNumber(gameState.player?.g, 0, 0) },
    residentName: String(gameState.residentName || getResidentSeal()?.name || CONFIG.resident.defaultName),
    camera: {
      x: safeFiniteNumber(gameState.camera?.x, CONFIG.camera.x),
      y: safeFiniteNumber(gameState.camera?.y, CONFIG.camera.y),
      zoom: clampNumber(gameState.camera?.zoom, CONFIG.camera.minZoom, CONFIG.camera.maxZoom, CONFIG.camera.zoom)
    },
    ui: {
      selectedTool: getTool(gameState.ui?.selectedTool)?.id ?? 'road',
      directionIndex: clampInteger(gameState.ui?.directionIndex, 0, CONFIG.directions.length - 1, 2)
    },
    world: {
      tiles: cloneSerializable(gameState.world?.tiles, []),
      roads: cloneSerializable(gameState.world?.roads, []),
      facilities: cloneSerializable(objects.filter(o => o?.kind === 'facility'), []),
      decorations: cloneSerializable(objects.filter(o => o?.kind === 'decoration'), []),
      nextObjectId: clampInteger(gameState.world?.nextObjectId, 1, Number.MAX_SAFE_INTEGER, 1)
    },
    gates: cloneSerializable(gameState.gates, cloneSerializable(CONFIG.gates, { entryGate: null, huntGates: [] })),
    seals: cloneSerializable((gameState.seals ?? []).map(seal => { const copy = { ...seal }; delete copy.path; delete copy.pathTargetKey; return copy; }), []),
    visitorProfiles: cloneSerializable(gameState.visitorProfiles, []),
    village: { knownness: safeFiniteNumber(gameState.village?.knownness, CONFIG.knownness.initial, 0) },
    calendar: { day: clampInteger(gameState.calendar?.day, 1, CONFIG.knownness.monthDays, 1), month: clampInteger(gameState.calendar?.month, 1, Number.MAX_SAFE_INTEGER, 1) },
    stats: { monthlyHunts: clampInteger(gameState.stats?.monthlyHunts, 0, Number.MAX_SAFE_INTEGER, 0) },
    monsters: cloneSerializable(gameState.monsters, []),
    logs: cloneSerializable(gameState.logs, []).slice(0, CONFIG.MAX_LOGS),
    timers: {
      spawn: safeFiniteNumber(gameState.timers?.spawn, 0, 0),
      monsterSpawn: safeFiniteNumber(gameState.timers?.monsterSpawn, gameState.timers?.spawn ?? 0, 0),
      visitorSpawn: safeFiniteNumber(gameState.timers?.visitorSpawn, 0, 0),
      day: safeFiniteNumber(gameState.timers?.day, 0, 0)
    },
    save: {
      autoSaveTimerMs: safeFiniteNumber(gameState.save?.autoSaveTimerMs, 0, 0),
      lastSavedAt: safeFiniteNumber(gameState.save?.lastSavedAt, null, 0) || null,
      statusText: String(gameState.save?.statusText ?? '')
    }
  };
}

function saveGame(reason) {
  if (gameState.phase !== CONFIG.phase.playing) return false;
  const saveReason = reason === 'auto' ? 'auto' : 'manual';
  const payload = {
    version: CONFIG.SAVE_VERSION,
    savedAt: Date.now(),
    reason: saveReason,
    gameState: getSerializableGameState()
  };
  try {
    window.localStorage?.setItem(CONFIG.SAVE_KEY, JSON.stringify(payload));
    gameState.save.lastSavedAt = payload.savedAt;
    gameState.save.statusText = saveReason === 'auto' ? '自動保存しました' : '手動保存しました';
    logMessage(gameState.save.statusText);
    updateStartSaveInfo();
    updateHud();
    return true;
  } catch (error) {
    gameState.save.statusText = '保存できませんでした（ブラウザの保存領域を確認してください）';
    logMessage(gameState.save.statusText);
    updateHud();
    return false;
  }
}

function loadGame() {
  const payload = readSavePayload();
  if (!validateLoadedGameState(payload)) {
    gameState.save.statusText = 'セーブデータを読み込めませんでした';
    logMessage(gameState.save.statusText);
    updateStartSaveInfo();
    updateHud();
    return false;
  }
  applyLoadedGameState(payload);
  logMessage('セーブデータを読み込みました');
  startScreen.style.display = 'none';
  updateToolButtons();
  updateHud();
  updateStartSaveInfo();
  return true;
}

function hasSaveData() {
  return validateLoadedGameState(readSavePayload());
}

function deleteSaveData() {
  try {
    window.localStorage?.removeItem(CONFIG.SAVE_KEY);
    updateStartSaveInfo();
    return true;
  } catch (error) {
    return false;
  }
}

function validateLoadedGameState(data) {
  const state = data?.gameState;
  if (!Number.isFinite(data?.version) || data.version < 1 || data.version > CONFIG.SAVE_VERSION) return false;
  if (!Number.isFinite(data?.savedAt) || !['manual', 'auto'].includes(data?.reason)) return false;
  if (!state || typeof state !== 'object') return false;
  if (!state.player || !Number.isFinite(state.player?.g)) return false;
  if (!state.world || !Array.isArray(state.world?.tiles) || state.world.tiles.length <= 0) return false;
  if (!Array.isArray(state.world?.roads)) return false;
  if (!Array.isArray(state.world?.facilities)) return false;
  if (!Array.isArray(state.world?.decorations)) return false;
  if (!Array.isArray(state.seals) || !Array.isArray(state.monsters)) return false;
  return true;
}

function applyLoadedGameState(data) {
  const fresh = createNewGameState();
  const loaded = data?.gameState ?? {};
  Object.assign(gameState, fresh);
  gameState.phase = CONFIG.phase.playing;
  gameState.player.g = safeFiniteNumber(loaded.player?.g, 0, 0);
  gameState.residentName = String(loaded.residentName || CONFIG.resident.defaultName);
  gameState.camera.x = safeFiniteNumber(loaded.camera?.x, CONFIG.camera.x);
  gameState.camera.y = safeFiniteNumber(loaded.camera?.y, CONFIG.camera.y);
  gameState.camera.zoom = clampNumber(loaded.camera?.zoom, CONFIG.camera.minZoom, CONFIG.camera.maxZoom, CONFIG.camera.zoom);
  gameState.ui.selectedTool = getTool(loaded.ui?.selectedTool)?.id ?? 'road';
  gameState.ui.directionIndex = clampInteger(loaded.ui?.directionIndex, 0, CONFIG.directions.length - 1, 2);
  gameState.world.tiles = normalizeTiles(loaded.world?.tiles);
  gameState.world.roads = normalizeRoads(loaded.world?.roads);
  gameState.world.objects = normalizeObjects([...(loaded.world?.facilities ?? []), ...(loaded.world?.decorations ?? [])]);
  gameState.world.nextObjectId = Math.max(nextObjectNumber(gameState.world.objects), clampInteger(loaded.world?.nextObjectId, 1, Number.MAX_SAFE_INTEGER, 1));
  gameState.gates = normalizeGates(loaded.gates);
  gameState.seals = normalizeSeals(loaded.seals);
  enforceSingleResidentSeal();
  gameState.visitorProfiles = normalizeVisitorProfiles(loaded.visitorProfiles);
  gameState.village.knownness = safeFiniteNumber(loaded.village?.knownness, CONFIG.knownness.initial, 0);
  gameState.calendar.day = clampInteger(loaded.calendar?.day, 1, CONFIG.knownness.monthDays, 1);
  gameState.calendar.month = clampInteger(loaded.calendar?.month, 1, Number.MAX_SAFE_INTEGER, 1);
  gameState.stats.monthlyHunts = clampInteger(loaded.stats?.monthlyHunts, 0, Number.MAX_SAFE_INTEGER, 0);
  gameState.monsters = normalizeMonsters(loaded.monsters);
  gameState.logs = Array.isArray(loaded.logs) ? loaded.logs.map(text => String(text)).slice(0, CONFIG.MAX_LOGS) : [];
  gameState.timers.spawn = safeFiniteNumber(loaded.timers?.spawn, 0, 0);
  gameState.timers.monsterSpawn = safeFiniteNumber(loaded.timers?.monsterSpawn, loaded.timers?.spawn ?? 0, 0);
  gameState.timers.visitorSpawn = safeFiniteNumber(loaded.timers?.visitorSpawn, 0, 0);
  gameState.timers.day = safeFiniteNumber(loaded.timers?.day, 0, 0);
  gameState.save.autoSaveTimerMs = safeFiniteNumber(loaded.save?.autoSaveTimerMs, 0, 0);
  gameState.save.lastSavedAt = safeFiniteNumber(data?.savedAt, null, 0) || null;
  gameState.save.statusText = `最終保存: ${formatSaveTime(gameState.save.lastSavedAt)}`;
}

function updateAutoSave(deltaMs) {
  if (gameState.phase !== CONFIG.phase.playing) return;
  gameState.save.autoSaveTimerMs += safeFiniteNumber(deltaMs, 0, 0);
  if (gameState.save.autoSaveTimerMs < CONFIG.AUTO_SAVE_INTERVAL_MS) return;
  gameState.save.autoSaveTimerMs = 0;
  saveGame('auto');
}

function readSavePayload() {
  try {
    const raw = window.localStorage?.getItem(CONFIG.SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (error) {
    return null;
  }
}

function startNewGame() {
  if (hasSaveData() && !window.confirm('既存のセーブデータを削除して新しく始めますか？')) return;
  deleteSaveData();
  Object.assign(gameState, createNewGameState());
  const residentName = String(window.prompt('住民あざらしの名前を入力してください', CONFIG.resident.defaultName) ?? '').trim() || CONFIG.resident.defaultName;
  initGame(residentName);
  gameState.save.statusText = '新しいゲームを開始しました';
  updateStartSaveInfo();
  updateHud();
}

function updateStartSaveInfo() {
  const payload = readSavePayload();
  const valid = validateLoadedGameState(payload);
  if (loadBtn) loadBtn.hidden = !valid;
  if (!startSaveInfoEl) return;
  if (valid) {
    startSaveInfoEl.textContent = `保存済みデータ: ${formatSaveTime(payload.savedAt)} / ${payload.reason === 'auto' ? '自動保存' : '手動保存'}`;
  } else if (payload) {
    startSaveInfoEl.textContent = 'セーブデータが壊れているか、バージョンが違うため読み込めません。';
  } else {
    startSaveInfoEl.textContent = '保存済みデータはありません。';
  }
}

function formatSaveTime(value) {
  if (!Number.isFinite(value)) return 'なし';
  return new Date(value).toLocaleString('ja-JP');
}

function safeFiniteNumber(value, fallback, min = -Infinity) {
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.max(min, number);
}

function clampNumber(value, min, max, fallback) {
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.max(min, Math.min(max, number));
}

function clampInteger(value, min, max, fallback) {
  return Math.trunc(clampNumber(value, min, max, fallback));
}

function normalizeTiles(tiles) {
  if (!Array.isArray(tiles) || tiles.length <= 0) return createWorldTiles();
  const fallback = createWorldTiles();
  return Array.from({ length: CONFIG.world.rows }, (_, y) => Array.from({ length: CONFIG.world.cols }, (_, x) => {
    const source = tiles?.[y]?.[x] ?? fallback[y][x];
    const terrainValues = [CONFIG.tileState.terrainWater, CONFIG.tileState.terrainLand, CONFIG.tileState.terrainOutside];
    const buildValues = [CONFIG.tileState.buildBlocked, CONFIG.tileState.buildable];
    const obstacleValues = [null, CONFIG.tileState.obstacleGrass, CONFIG.tileState.obstacleTree, CONFIG.tileState.obstacleRock];
    return {
      terrain: terrainValues.includes(source?.terrain) ? source.terrain : fallback[y][x].terrain,
      buildState: buildValues.includes(source?.buildState) ? source.buildState : fallback[y][x].buildState,
      obstacle: obstacleValues.includes(source?.obstacle ?? null) ? (source?.obstacle ?? null) : fallback[y][x].obstacle,
      unlocked: source?.unlocked === true
    };
  }));
}

function normalizeRoads(roads) {
  if (!Array.isArray(roads)) return [];
  return roads.map(r => ({ x: clampInteger(r?.x, 0, CONFIG.world.cols - 1, 0), y: clampInteger(r?.y, 0, CONFIG.world.rows - 1, 0) }));
}

function normalizeObjects(objects) {
  if (!Array.isArray(objects)) return [];
  return objects.map((o, index) => {
    const tool = getTool(o?.type);
    if (!tool || !['facility', 'decoration'].includes(tool.kind)) return null;
    return {
      id: String(o?.id || `obj-${index + 1}`),
      type: tool.id,
      kind: tool.kind,
      x: clampInteger(o?.x, 0, CONFIG.world.cols - 1, 0),
      y: clampInteger(o?.y, 0, CONFIG.world.rows - 1, 0),
      w: tool.w,
      h: tool.h,
      directionIndex: clampInteger(o?.directionIndex, 0, CONFIG.directions.length - 1, 0)
    };
  }).filter(Boolean);
}

function normalizeGates(gates) {
  const fallback = cloneSerializable(CONFIG.gates, { entryGate: null, huntGates: [] });
  const entrySource = gates?.entryGate ?? fallback.entryGate;
  const entryGate = entrySource ? {
    id: String(entrySource?.id || fallback.entryGate?.id || 'entry_south'),
    x: clampInteger(entrySource?.x, 0, CONFIG.world.cols - 1, fallback.entryGate?.x ?? CONFIG.world.safeX),
    y: clampInteger(entrySource?.y, 0, CONFIG.world.rows - 1, fallback.entryGate?.y ?? CONFIG.world.safeY)
  } : null;
  const huntSource = Array.isArray(gates?.huntGates) && gates.huntGates.length > 0 ? gates.huntGates : fallback.huntGates;
  const huntGates = (huntSource ?? []).map((gate, index) => ({
    id: String(gate?.id || `hunt_gate_${index + 1}`),
    village: normalizeGatePoint(gate?.village, fallback.huntGates?.[index]?.village ?? { x: CONFIG.world.safeX, y: CONFIG.world.safeY }),
    outside: normalizeGatePoint(gate?.outside, fallback.huntGates?.[index]?.outside ?? { x: CONFIG.world.coastX, y: CONFIG.world.coastY }),
    areaId: String(gate?.areaId || fallback.huntGates?.[index]?.areaId || 'coast')
  })).filter(gate => gate?.id && gate?.village && gate?.outside);
  return { entryGate, huntGates };
}

function normalizeGatePoint(point, fallback) {
  return {
    x: clampInteger(point?.x, 0, CONFIG.world.cols - 1, fallback?.x ?? 0),
    y: clampInteger(point?.y, 0, CONFIG.world.rows - 1, fallback?.y ?? 0)
  };
}

function normalizeSeals(seals) {
  if (!Array.isArray(seals)) return [];
  const states = ['arriving', 'choosingHuntGate', 'movingToHuntGate', 'hunting', 'movingToMonster', 'fighting', 'returningFromHunt', 'choosingFacility', 'movingToFacility', 'usingFacility', 'leaving', 'resting', 'fallen', 'rescuing', 'carryingFallenSeal'];
  return seals.map((s, index) => normalizeSeal(s, index)).filter(Boolean).map(seal => {
    if (!states.includes(seal.state)) seal.state = seal.type === 'visitor' ? 'arriving' : 'choosingHuntGate';
    return seal;
  });
}

function normalizeSeal(s, index) {
  if (!s || typeof s !== 'object') return null;
  const entry = gatePointToWorld(gameState.gates?.entryGate) ?? gridToWorld(CONFIG.world.safeX, CONFIG.world.safeY);
  const isVisitor = s?.type === 'visitor';
  return {
    id: String(s?.id || (isVisitor ? `visitor-${Date.now()}-${index}` : 'resident-seal')),
    profileId: s?.profileId ? String(s.profileId) : null,
    name: String(s?.name || (isVisitor ? (getVisitorProfileById(s?.profileId)?.name ?? CONFIG.resident.defaultName) : CONFIG.resident.defaultName)),
    personality: String(s?.personality || (isVisitor ? (getVisitorProfileById(s?.profileId)?.personality ?? 'balanced') : 'balanced')),
    type: isVisitor ? 'visitor' : 'resident',
    x: safeFiniteNumber(s?.x, entry.x),
    y: safeFiniteNumber(s?.y, entry.y),
    hp: safeFiniteNumber(s?.hp, CONFIG.seal.maxHp, 0),
    maxHp: safeFiniteNumber(s?.maxHp, CONFIG.seal.maxHp, 1),
    attack: safeFiniteNumber(s?.attack, CONFIG.seal.attack, 0),
    defense: safeFiniteNumber(s?.defense, CONFIG.seal.defense, 0),
    carriedG: safeFiniteNumber(s?.carriedG, 0, 0),
    exp: safeFiniteNumber(s?.exp, 0, 0),
    level: clampInteger(s?.level, 1, Number.MAX_SAFE_INTEGER, 1),
    favor: safeFiniteNumber(s?.favor, 0, 0),
    state: String(s?.state || (isVisitor ? 'arriving' : 'choosingHuntGate')),
    targetId: s?.targetId ? String(s.targetId) : null,
    target: s?.target ? { x: safeFiniteNumber(s.target?.x, entry.x), y: safeFiniteNumber(s.target?.y, entry.y) } : null,
    selectedHuntGateId: s?.selectedHuntGateId ? String(s.selectedHuntGateId) : null,
    visits: clampInteger(s?.visits, 0, Number.MAX_SAFE_INTEGER, isVisitor ? 1 : 0),
    facilityUseCounts: normalizeFacilityUseCounts(s?.facilityUseCounts),
    mealCountSinceInn: clampInteger(s?.mealCountSinceInn, 0, Number.MAX_SAFE_INTEGER, 0),
    leaveAfterFacilityUse: s?.leaveAfterFacilityUse === true,
    rescueTargetId: s?.rescueTargetId ? String(s.rescueTargetId) : null,
    combatTimer: safeFiniteNumber(s?.combatTimer, 0, 0),
    monsterTimer: safeFiniteNumber(s?.monsterTimer, 0, 0),
    actionTimer: safeFiniteNumber(s?.actionTimer, 0, 0),
    huntTimer: safeFiniteNumber(s?.huntTimer, 0, 0),
    wanderTimer: safeFiniteNumber(s?.wanderTimer, 0, 0),
    noMonsterTimer: safeFiniteNumber(s?.noMonsterTimer, 0, 0),
    huntCountThisTrip: clampInteger(s?.huntCountThisTrip, 0, Number.MAX_SAFE_INTEGER, 0),
    visitTimerMs: safeFiniteNumber(s?.visitTimerMs, 0, 0),
    minStayMs: safeFiniteNumber(s?.minStayMs, CONFIG.visitor.minStayMs, 0),
    maxStayMs: safeFiniteNumber(s?.maxStayMs, CONFIG.visitor.maxStayMs, 0),
    huntsThisVisit: clampInteger(s?.huntsThisVisit, 0, Number.MAX_SAFE_INTEGER, 0),
    facilitiesUsedThisVisit: clampInteger(s?.facilitiesUsedThisVisit, 0, Number.MAX_SAFE_INTEGER, 0),
    wantsToLeave: s?.wantsToLeave === true,
    path: [],
    pathTargetKey: null,
    warnedPathFallback: s?.warnedPathFallback === true
  };
}

function normalizeFacilityUseCounts(counts) {
  return {
    inn: clampInteger(counts?.inn, 0, Number.MAX_SAFE_INTEGER, 0),
    restaurant: clampInteger(counts?.restaurant, 0, Number.MAX_SAFE_INTEGER, 0),
    blacksmith: clampInteger(counts?.blacksmith, 0, Number.MAX_SAFE_INTEGER, 0)
  };
}

function normalizeVisitorProfiles(profiles) {
  const saved = Array.isArray(profiles) ? profiles : [];
  return createDefaultVisitorProfiles().map(defaultProfile => {
    const loaded = saved.find(p => p?.id === defaultProfile.id) ?? {};
    return {
      ...defaultProfile,
      level: clampInteger(loaded?.level, 1, Number.MAX_SAFE_INTEGER, defaultProfile.level),
      exp: safeFiniteNumber(loaded?.exp, defaultProfile.exp, 0),
      favor: safeFiniteNumber(loaded?.favor, defaultProfile.favor, 0),
      visits: clampInteger(loaded?.visits, 0, Number.MAX_SAFE_INTEGER, defaultProfile.visits),
      unlocked: loaded?.unlocked === true || defaultProfile.unlocked
    };
  });
}

function getVisitorProfileById(id) {
  return (gameState.visitorProfiles ?? []).find(profile => profile?.id === id) ?? (CONFIG.visitor?.profiles ?? []).find(profile => profile?.id === id) ?? null;
}

function normalizeMonsters(monsters) {
  if (!Array.isArray(monsters)) return [];
  return monsters.map((m, index) => ({
    id: String(m?.id || `crab-${Date.now()}-${index}`),
    type: 'crab',
    areaId: String(m?.areaId || 'coast'),
    x: safeFiniteNumber(m?.x, randomCoastPoint().x),
    y: safeFiniteNumber(m?.y, randomCoastPoint().y),
    hp: safeFiniteNumber(m?.hp, CONFIG.monster.hp, 0),
    maxHp: safeFiniteNumber(m?.maxHp, CONFIG.monster.hp, 1),
    attack: safeFiniteNumber(m?.attack, CONFIG.monster.attack, 0),
    defense: safeFiniteNumber(m?.defense, CONFIG.monster.defense, 0),
    assignedSealId: m?.assignedSealId ? String(m.assignedSealId) : null
  }));
}

function nextObjectNumber(objects) {
  return objects.reduce((max, object) => {
    const match = String(object?.id ?? '').match(/^obj-(\d+)$/);
    return Math.max(max, match ? Number(match[1]) + 1 : 1);
  }, 1);
}

function createImage(key) {
  const cached = gameState.images?.[key];
  if (cached) return cached;
  const parts = String(key || '').split('.');
  const folder = parts?.[0] === 'cards' ? '/assets/cards/' : '/assets/monsters/';
  const name = parts?.[1] || 'unknown';
  const img = new Image();
  const record = { img, loaded: false, failed: false };
  img.onload = () => { record.loaded = true; };
  img.onerror = () => { record.failed = true; };
  img.src = `${folder}${name}.png`;
  gameState.images[key] = record;
  return record;
}

function safeDrawImage(context, imageRecord, x, y, w, h, fallback) {
  const img = imageRecord?.img;
  if (imageRecord?.loaded && img?.complete && img?.naturalWidth > 0) {
    context.drawImage(img, x, y, w, h);
    return true;
  }
  if (typeof fallback === 'function') fallback(context, x, y, w, h);
  return false;
}

function logMessage(text) {
  gameState.logs.unshift(text);
  gameState.logs.length = Math.min(gameState.logs.length, CONFIG.MAX_LOGS);
}

function initGame(residentName) {
  gameState.phase = CONFIG.phase.playing;
  gameState.player.g = 0;
  gameState.residentName = String(residentName || gameState.residentName || CONFIG.resident.defaultName).trim() || CONFIG.resident.defaultName;
  gameState.world.tiles = createWorldTiles();
  gameState.world.roads = [];
  gameState.world.objects = [];
  gameState.world.nextObjectId = 1;
  gameState.gates = normalizeGates(CONFIG.gates);
  gameState.monsters = [];
  gameState.visitorProfiles = createDefaultVisitorProfiles();
  gameState.logs = [];
  gameState.village.knownness = CONFIG.knownness.initial;
  gameState.calendar.day = 1;
  gameState.calendar.month = 1;
  gameState.stats.monthlyHunts = 0;
  gameState.timers.spawn = 0;
  gameState.timers.monsterSpawn = 0;
  gameState.timers.visitorSpawn = 0;
  gameState.timers.ui = 0;
  gameState.save.autoSaveTimerMs = 0;
  gameState.save.lastSavedAt = null;
  gameState.seals = [createResidentSeal(gameState.residentName)];
  addDefaultVillage();
  startScreen.style.display = 'none';
  logMessage('ゲーム開始。住民あざらしが門から冒険へ向かいます。');
}

function addDefaultVillage() {
  for (const item of CONFIG.village.defaults) unlockFootprint(item.x, item.y, getTool(item.type)?.w ?? CONFIG.placement.decorationSize, getTool(item.type)?.h ?? CONFIG.placement.decorationSize);
  for (let x = CONFIG.village.roadStartX; x <= CONFIG.village.roadEndX; x += 1) gameState.world.roads.push({ x, y: CONFIG.village.roadY });
  for (let y = CONFIG.village.roadStartY; y <= CONFIG.village.roadEndY; y += 1) gameState.world.roads.push({ x: CONFIG.village.roadX, y });
  for (const item of CONFIG.village.defaults) placeObject(item.type, item.x, item.y, item.directionIndex ?? 0, true);
}

function gridToWorld(gx, gy) {
  return { x: (gx + 0.5) * CONFIG.world.tile, y: (gy + 0.5) * CONFIG.world.tile };
}

function worldToGrid(x, y) {
  return { x: Math.floor(x / CONFIG.world.tile), y: Math.floor(y / CONFIG.world.tile) };
}

function inRect(gx, gy, x, y, w, h) { return gx >= x && gy >= y && gx < x + w && gy < y + h; }
function isInExpansionRegion(gx, gy) { return inRect(gx, gy, CONFIG.expansion.regionX, CONFIG.expansion.regionY, CONFIG.expansion.regionW, CONFIG.expansion.regionH); }
function isInStartingVillage(gx, gy) { return inRect(gx, gy, CONFIG.expansion.startX, CONFIG.expansion.startY, CONFIG.expansion.startW, CONFIG.expansion.startH); }

function createWorldTiles() {
  return Array.from({ length: CONFIG.world.rows }, (_, y) => Array.from({ length: CONFIG.world.cols }, (_, x) => createTile(x, y)));
}

function createTile(x, y) {
  const state = CONFIG.tileState;
  if (isCoastTile(x, y)) return { terrain: state.terrainOutside, buildState: state.buildBlocked, obstacle: null, unlocked: false };
  if (!isIslandTile(x, y)) return { terrain: state.terrainWater, buildState: state.buildBlocked, obstacle: null, unlocked: false };
  const startsBuildable = isInStartingVillage(x, y);
  return {
    terrain: state.terrainLand,
    buildState: startsBuildable ? state.buildable : state.buildBlocked,
    obstacle: startsBuildable ? null : obstacleForTile(x, y),
    unlocked: startsBuildable
  };
}

function obstacleForTile(x, y) {
  const roll = Math.abs((x * CONFIG.expansion.obstacleSeedA + y * CONFIG.expansion.obstacleSeedB) % CONFIG.expansion.obstacleModulo);
  if (roll < CONFIG.expansion.grassLimit) return CONFIG.tileState.obstacleGrass;
  if (roll < CONFIG.expansion.treeLimit) return CONFIG.tileState.obstacleTree;
  return CONFIG.tileState.obstacleRock;
}

function getTile(x, y) {
  return gameState.world.tiles?.[y]?.[x] ?? null;
}

function isBuildableTile(x, y) {
  const tile = getTile(x, y);
  return tile?.terrain === CONFIG.tileState.terrainLand
    && tile?.buildState === CONFIG.tileState.buildable
    && tile?.obstacle === null
    && tile?.unlocked === true
    && isInExpansionRegion(x, y);
}

function isBlockedLandTile(x, y) {
  const tile = getTile(x, y);
  return tile?.terrain === CONFIG.tileState.terrainLand
    && tile?.buildState === CONFIG.tileState.buildBlocked
    && tile?.obstacle !== null
    && isInExpansionRegion(x, y);
}

function unlockFootprint(gx, gy, w, h) {
  for (let y = gy; y < gy + h; y += 1) {
    for (let x = gx; x < gx + w; x += 1) {
      const tile = getTile(x, y);
      if (tile?.terrain !== CONFIG.tileState.terrainLand) continue;
      tile.buildState = CONFIG.tileState.buildable;
      tile.obstacle = null;
      tile.unlocked = true;
    }
  }
}

function getTilesInRadius(tileX, tileY, radius) {
  const tiles = [];
  for (let y = tileY - radius; y <= tileY + radius; y += 1) {
    for (let x = tileX - radius; x <= tileX + radius; x += 1) {
      if (distance(tileX, tileY, x, y) <= radius) tiles.push({ x, y, tile: getTile(x, y) });
    }
  }
  return tiles;
}

function canPlaceAt(tileX, tileY, objectDef) {
  const tool = objectDef ?? getTool(gameState.ui.selectedTool);
  if (tool?.kind === 'delete') return { ok: true, reason: '' };
  if (tool?.kind === 'clear') return { ok: false, reason: '開拓ツールでは配置できません。' };
  const w = tool?.w ?? CONFIG.placement.decorationSize;
  const h = tool?.h ?? CONFIG.placement.decorationSize;
  for (let y = tileY; y < tileY + h; y += 1) {
    for (let x = tileX; x < tileX + w; x += 1) {
      const tile = getTile(x, y);
      if (!tile) return { ok: false, reason: 'マップ外です。' };
      if (tile?.terrain === CONFIG.tileState.terrainWater) return { ok: false, reason: '水上には配置できません。' };
      if (tile?.terrain === CONFIG.tileState.terrainOutside) return { ok: false, reason: '外の冒険エリアには配置できません。' };
      if (!isInExpansionRegion(x, y)) return { ok: false, reason: '村の開拓範囲外です。' };
      if (!isBuildableTile(x, y)) return { ok: false, reason: '未開拓または障害物がある土地です。' };
      if (objectAt(x, y)) return { ok: false, reason: '他の物があります。' };
      if (tool?.kind !== 'road' && roadAt(x, y)) return { ok: false, reason: '道路の上には置けません。' };
    }
  }
  return { ok: true, reason: '' };
}

function canClearAt(tileX, tileY) {
  const tile = getTile(tileX, tileY);
  if (!tile) return { ok: false, reason: 'マップ外です。' };
  if (tile?.terrain !== CONFIG.tileState.terrainLand) return { ok: false, reason: '水辺や外の冒険エリアは開拓できません。' };
  if (!isInExpansionRegion(tileX, tileY)) return { ok: false, reason: '村の開拓範囲外です。' };
  if (!isBlockedLandTile(tileX, tileY)) return { ok: false, reason: 'ここは開拓対象の障害物付き土地ではありません。' };
  if (gameState.player.g < CONFIG.expansion.clearCost) return { ok: false, reason: `${CONFIG.expansion.clearCost}G必要です。` };
  return { ok: true, reason: '' };
}

function clearLandAt(tileX, tileY) {
  const result = canClearAt(tileX, tileY);
  if (!result.ok) {
    logMessage(`開拓できません：${result.reason}`);
    gameState.ui.placementFeedback = { x: tileX, y: tileY, ok: false, text: result.reason, timer: CONFIG.placement.feedbackSeconds };
    return false;
  }
  gameState.player.g -= CONFIG.expansion.clearCost;
  let cleared = 0;
  for (const entry of getTilesInRadius(tileX, tileY, CONFIG.expansion.clearRadius)) {
    const x = entry?.x ?? 0;
    const y = entry?.y ?? 0;
    const tile = entry?.tile;
    if (tile?.terrain !== CONFIG.tileState.terrainLand || !isInExpansionRegion(x, y) || objectAt(x, y) || roadAt(x, y)) continue;
    tile.buildState = CONFIG.tileState.buildable;
    tile.obstacle = null;
    tile.unlocked = true;
    cleared += 1;
  }
  logMessage(`${CONFIG.expansion.clearCost}Gで${cleared}マスを開拓しました。`);
  gameState.ui.placementFeedback = { x: tileX, y: tileY, ok: true, text: '開拓しました。', timer: CONFIG.placement.feedbackSeconds };
  return true;
}

function isIslandTile(gx, gy) { return inRect(gx, gy, CONFIG.world.islandX, CONFIG.world.islandY, CONFIG.world.islandW, CONFIG.world.islandH); }
function isCoastTile(gx, gy) { return inRect(gx, gy, CONFIG.world.coastX, CONFIG.world.coastY, CONFIG.world.coastW, CONFIG.world.coastH); }
function roadAt(gx, gy) { return gameState.world.roads.some(r => r?.x === gx && r?.y === gy); }
function objectAt(gx, gy) { return gameState.world.objects.find(o => gx >= o?.x && gy >= o?.y && gx < (o?.x ?? 0) + (o?.w ?? 1) && gy < (o?.y ?? 0) + (o?.h ?? 1)); }

function getTool(id) { return CONFIG.tools.find(t => t.id === id) ?? CONFIG.tools[0]; }

function canPlace(type, gx, gy) {
  return canPlaceAt(gx, gy, getTool(type));
}

function placeObject(type, gx, gy, directionIndex, silent) {
  const result = canPlace(type, gx, gy);
  if (!result.ok) {
    gameState.ui.placementFeedback = { x: gx, y: gy, ok: false, text: result.reason, timer: CONFIG.placement.feedbackSeconds };
    return false;
  }
  const tool = getTool(type);
  if (tool?.kind === 'road') {
    if (!roadAt(gx, gy)) gameState.world.roads.push({ x: gx, y: gy });
  } else if (tool?.kind !== 'delete') {
    gameState.world.objects.push({ id: `obj-${gameState.world.nextObjectId++}`, type, kind: tool?.kind, x: gx, y: gy, w: tool?.w, h: tool?.h, directionIndex });
  }
  if (!silent) gameState.ui.placementFeedback = { x: gx, y: gy, ok: true, text: '配置しました。', timer: CONFIG.placement.feedbackSeconds };
  return true;
}

function deleteAt(gx, gy) {
  const obj = objectAt(gx, gy);
  if (obj?.id) {
    gameState.world.objects = gameState.world.objects.filter(o => o?.id !== obj.id);
    gameState.ui.placementFeedback = { x: gx, y: gy, ok: true, text: '削除しました。', timer: CONFIG.placement.feedbackSeconds };
    return;
  }
  const before = gameState.world.roads.length;
  gameState.world.roads = gameState.world.roads.filter(r => !(r?.x === gx && r?.y === gy));
  gameState.ui.placementFeedback = { x: gx, y: gy, ok: before !== gameState.world.roads.length, text: before !== gameState.world.roads.length ? '削除しました。' : '削除対象がありません。', timer: CONFIG.placement.feedbackSeconds };
}

function entranceTile(facility) {
  const index = facility?.directionIndex ?? 0;
  const x = facility?.x ?? 0;
  const y = facility?.y ?? 0;
  const w = facility?.w ?? CONFIG.placement.facilitySize;
  const h = facility?.h ?? CONFIG.placement.facilitySize;
  if (CONFIG.directions[index]?.name === 'N') return { x: x + Math.floor(w / 2), y: y - 1 };
  if (CONFIG.directions[index]?.name === 'E') return { x: x + w, y: y + Math.floor(h / 2) };
  if (CONFIG.directions[index]?.name === 'S') return { x: x + Math.floor(w / 2), y: y + h };
  return { x: x - 1, y: y + Math.floor(h / 2) };
}

function isFacilityUsable(facility) {
  if (facility?.kind !== 'facility') return false;
  const e = entranceTile(facility);
  return roadAt(e.x, e.y);
}

function facilityBonus(facility) {
  const cfg = CONFIG.facilities[facility?.type];
  if (!cfg) return 0;
  const adjacentCells = new Set();
  for (let y = facility?.y ?? 0; y < (facility?.y ?? 0) + (facility?.h ?? 1); y += 1) {
    for (let x = facility?.x ?? 0; x < (facility?.x ?? 0) + (facility?.w ?? 1); x += 1) {
      for (const dir of CONFIG.directions) adjacentCells.add(`${x + dir.dx},${y + dir.dy}`);
    }
  }
  const count = gameState.world.objects.filter(o => o?.type === cfg.bonusDecoration && adjacentCells.has(`${o.x},${o.y}`)).length;
  return count * cfg.bonusRate;
}

function usableFacilities(type) {
  return gameState.world.objects.filter(o => o?.type === type && isFacilityUsable(o));
}

function nearestFacility(type, x, y) {
  const list = usableFacilities(type);
  return list.reduce((best, item) => !best || distance(x, y, centerOfObject(item).x, centerOfObject(item).y) < distance(x, y, centerOfObject(best).x, centerOfObject(best).y) ? item : best, null);
}

function centerOfObject(obj) { return { x: ((obj?.x ?? 0) + (obj?.w ?? 1) / 2) * CONFIG.world.tile, y: ((obj?.y ?? 0) + (obj?.h ?? 1) / 2) * CONFIG.world.tile }; }
function distance(ax, ay, bx, by) { return Math.hypot((bx ?? 0) - (ax ?? 0), (by ?? 0) - (ay ?? 0)); }
function randomRange(min, max) { return min + Math.random() * (max - min); }
function randomCoastPoint() { return gridToWorld(Math.floor(randomRange(CONFIG.world.coastX, CONFIG.world.coastX + CONFIG.world.coastW)), Math.floor(randomRange(CONFIG.world.coastY, CONFIG.world.coastY + CONFIG.world.coastH))); }

function createResidentSeal(name) {
  const safe = gridToWorld(CONFIG.world.safeX, CONFIG.world.safeY);
  return normalizeSeal({
    id: 'resident-seal', name: String(name || gameState.residentName || CONFIG.resident.defaultName), type: 'resident', personality: 'balanced', x: safe.x, y: safe.y,
    hp: CONFIG.seal.maxHp, maxHp: CONFIG.seal.maxHp, attack: CONFIG.seal.attack, defense: CONFIG.seal.defense,
    carriedG: CONFIG.seal.startG, exp: 0, level: 1, favor: 0, state: 'choosingHuntGate', visits: 0
  }, 0);
}

function ensureResidentSeal() {
  if (gameState.seals?.some(seal => seal?.type === 'resident')) return;
  gameState.seals = [createResidentSeal(gameState.residentName), ...(Array.isArray(gameState.seals) ? gameState.seals : [])];
}

function enforceSingleResidentSeal() {
  let residentSeen = false;
  gameState.seals = (Array.isArray(gameState.seals) ? gameState.seals : []).map((seal, index) => {
    if (seal?.type === 'resident' && !residentSeen) { residentSeen = true; seal.id = 'resident-seal'; return seal; }
    if (seal?.type === 'resident') { seal.type = 'visitor'; seal.profileId = seal.profileId ?? null; seal.state = 'leaving'; seal.target = gatePointToWorld(gameState.gates?.entryGate) ?? villageWanderPoint(); }
    return seal;
  });
  ensureResidentSeal();
}

function gatePointToWorld(point) {
  if (!point || !Number.isFinite(Number(point.x)) || !Number.isFinite(Number(point.y))) return null;
  return gridToWorld(point.x, point.y);
}

function huntAreaBounds(areaId) {
  if (areaId === 'coast') return { x: CONFIG.world.coastX, y: CONFIG.world.coastY, w: CONFIG.world.coastW, h: CONFIG.world.coastH };
  return { x: CONFIG.world.coastX, y: CONFIG.world.coastY, w: CONFIG.world.coastW, h: CONFIG.world.coastH };
}

function randomHuntAreaPoint(areaId) {
  const area = huntAreaBounds(areaId);
  return gridToWorld(Math.floor(randomRange(area.x, area.x + area.w)), Math.floor(randomRange(area.y, area.y + area.h)));
}

function getHuntGateById(id) {
  return (gameState.gates?.huntGates ?? []).find(gate => gate?.id === id) ?? null;
}

function nearestHuntGate(x, y, areaId = null) {
  const gates = (gameState.gates?.huntGates ?? []).filter(gate => gate?.id && (!areaId || gate?.areaId === areaId));
  return gates.reduce((best, gate) => {
    const point = gatePointToWorld(gate?.village) ?? gatePointToWorld(gate?.outside);
    if (!point) return best;
    return !best || distance(x, y, point.x, point.y) < distance(x, y, (gatePointToWorld(best?.village) ?? point).x, (gatePointToWorld(best?.village) ?? point).y) ? gate : best;
  }, null);
}

function selectedOrNearestHuntGate(seal) {
  return getHuntGateById(seal?.selectedHuntGateId) ?? nearestHuntGate(seal?.x, seal?.y);
}

function warnNoHuntGate(seal) {
  seal.wanderTimer = CONFIG.seal.wanderSeconds;
  seal.state = 'choosingFacility';
  seal.target = villageWanderPoint();
  logMessage('狩猟門がないため、あざらしは村を歩いています。');
}

function villageWanderPoint() {
  return gridToWorld(Math.floor(randomRange(CONFIG.expansion.startX, CONFIG.expansion.startX + CONFIG.expansion.startW)), Math.floor(randomRange(CONFIG.expansion.startY, CONFIG.expansion.startY + CONFIG.expansion.startH)));
}

function update(dt) {
  if (gameState.phase !== CONFIG.phase.playing) return;
  gameState.frameTemps.occupied.clear();
  gameState.frameTemps.usableFacilities.length = 0;
  gameState.frameTemps.toRemoveMonsters.length = 0;
  updateCamera(dt);
  updatePlacementFeedback(dt);
  updateKnownness(dt * 1000);
  updateSpawner(dt);
  updateSeals(dt);
  removeDefeatedMonsters();
  updateAutoSave(dt * 1000);
  gameState.timers.ui += dt;
  if (gameState.timers.ui >= CONFIG.timing.uiMs / 1000) {
    gameState.ui.needsHudUpdate = true;
    gameState.timers.ui = 0;
  }
}

function updateKnownness(deltaMs) {
  gameState.timers.day = safeFiniteNumber(gameState.timers?.day, 0, 0) + safeFiniteNumber(deltaMs, 0, 0);
  if (gameState.timers.day < CONFIG.knownness.dayIntervalMs) return;
  gameState.timers.day = 0;
  gameState.calendar.day = clampInteger(gameState.calendar?.day, 1, CONFIG.knownness.monthDays, 1) + 1;
  if (gameState.calendar.day <= CONFIG.knownness.monthDays) return;
  const hunts = clampInteger(gameState.stats?.monthlyHunts, 0, Number.MAX_SAFE_INTEGER, 0);
  const reward = CONFIG.knownness.monthlyBaseReward + hunts * CONFIG.knownness.huntRewardPerMonthlyHunt;
  gameState.village.knownness = safeFiniteNumber(gameState.village?.knownness, 0, 0) + reward;
  gameState.calendar.month = clampInteger(gameState.calendar?.month, 1, Number.MAX_SAFE_INTEGER, 1) + 1;
  gameState.calendar.day = 1;
  gameState.stats.monthlyHunts = 0;
  unlockKnownVisitors();
  logMessage(`${gameState.calendar.month - 1}月の狩猟${hunts}回で知名度+${reward}。`);
}

function unlockKnownVisitors() {
  const knownness = safeFiniteNumber(gameState.village?.knownness, 0, 0);
  for (const profile of gameState.visitorProfiles ?? []) {
    if (!profile || profile.unlocked || knownness < safeFiniteNumber(profile.unlockedAtKnownness, 0, 0)) continue;
    profile.unlocked = true;
    logMessage(`${profile.name}が村を知りました。`);
  }
}

function updateCamera(dt) {
  const keys = gameState.input.keys;
  const speed = CONFIG.camera.panSpeed * dt / (gameState.camera.zoom || 1);
  if (keys?.KeyA || keys?.ArrowLeft) gameState.camera.x -= speed;
  if (keys?.KeyD || keys?.ArrowRight) gameState.camera.x += speed;
  if (keys?.KeyW || keys?.ArrowUp) gameState.camera.y -= speed;
  if (keys?.KeyS || keys?.ArrowDown) gameState.camera.y += speed;
}

function updatePlacementFeedback(dt) {
  const feedback = gameState.ui.placementFeedback;
  if (!feedback) return;
  feedback.timer -= dt;
  if (feedback.timer <= 0) gameState.ui.placementFeedback = null;
}

function updateSpawner(dt) {
  updateMonsterSpawner(dt);
  updateVisitorSpawner(dt);
}

function updateMonsterSpawner(dt) {
  gameState.timers.monsterSpawn = safeFiniteNumber(gameState.timers?.monsterSpawn, gameState.timers?.spawn ?? 0, 0) + dt;
  gameState.timers.spawn = gameState.timers.monsterSpawn;
  if (gameState.timers.monsterSpawn < CONFIG.monster.spawnInterval) return;
  gameState.timers.monsterSpawn = 0;
  gameState.timers.spawn = 0;
  if ((gameState.monsters ?? []).length >= CONFIG.monster.cap) return;
  const p = randomCoastPoint();
  gameState.monsters.push({ id: `crab-${Date.now()}-${Math.random().toString(16).slice(2)}`, type: 'crab', areaId: 'coast', x: p.x, y: p.y, hp: CONFIG.monster.hp, maxHp: CONFIG.monster.hp, attack: CONFIG.monster.attack, defense: CONFIG.monster.defense, assignedSealId: null });
}

function updateVisitorSpawner(dt) {
  const activeVisitors = (gameState.seals ?? []).filter(seal => seal?.type === 'visitor').length;
  if (activeVisitors >= CONFIG.visitor.maxActive) return;
  const totalFavor = (gameState.visitorProfiles ?? []).reduce((sum, profile) => sum + safeFiniteNumber(profile?.favor, 0, 0), 0);
  const intervalMultiplier = Math.max(CONFIG.visitor.minSpawnIntervalMultiplier, 1 - totalFavor * CONFIG.visitor.spawnIntervalFavorReduction);
  const interval = CONFIG.visitor.spawnInterval * intervalMultiplier;
  gameState.timers.visitorSpawn = safeFiniteNumber(gameState.timers?.visitorSpawn, 0, 0) + dt;
  if (gameState.timers.visitorSpawn < interval) return;
  gameState.timers.visitorSpawn = 0;
  spawnVisitor();
}

function chooseUnlockedVisitorProfile() {
  const knownness = safeFiniteNumber(gameState.village?.knownness, CONFIG.knownness.initial, 0);
  const activeIds = new Set((gameState.seals ?? []).filter(seal => seal?.type === 'visitor').map(seal => seal.profileId));
  const candidates = (gameState.visitorProfiles ?? []).filter(profile => profile && knownness >= safeFiniteNumber(profile.unlockedAtKnownness, 0, 0));
  const available = candidates.filter(profile => !activeIds.has(profile.id));
  const pool = available.length > 0 ? available : candidates;
  const weighted = pool.map(profile => ({
    profile,
    weight: CONFIG.visitor.returnBaseWeight
      + safeFiniteNumber(profile?.favor, 0, 0) * CONFIG.visitor.returnFavorWeight
      + (activeIds.has(profile?.id) ? 0 : CONFIG.visitor.inactiveWeightBonus)
  }));
  const total = weighted.reduce((sum, item) => sum + Math.max(0, item.weight), 0);
  let roll = Math.random() * Math.max(total, 1);
  for (const item of weighted) {
    roll -= Math.max(0, item.weight);
    if (roll <= 0) return item.profile;
  }
  return weighted[0]?.profile ?? null;
}

function spawnVisitorFromProfile(profile) {
  if (!profile) return null;
  const entry = gatePointToWorld(gameState.gates?.entryGate) ?? gridToWorld(CONFIG.world.safeX, CONFIG.world.safeY);
  profile.visits = clampInteger(profile.visits, 0, Number.MAX_SAFE_INTEGER, 0) + 1;
  profile.unlocked = true;
  const base = profile.baseStats ?? {};
  const favorBonus = Math.min(CONFIG.visitor.maxStayFavorBonusMs, safeFiniteNumber(profile.favor, 0, 0) * CONFIG.visitor.maxStayFavorMsPerFavor);
  const visitor = normalizeSeal({
    id: `visitor-${profile.id}-${Date.now()}`,
    profileId: profile.id,
    name: profile.name,
    personality: profile.personality,
    type: 'visitor',
    x: entry.x,
    y: entry.y,
    hp: safeFiniteNumber(base.maxHp, CONFIG.seal.maxHp, 1),
    maxHp: safeFiniteNumber(base.maxHp, CONFIG.seal.maxHp, 1) + Math.max(0, profile.level - 1) * CONFIG.seal.levelHpGain,
    attack: safeFiniteNumber(base.attack, CONFIG.seal.attack, 0) + Math.max(0, profile.level - 1) * CONFIG.seal.levelAttackGain,
    defense: safeFiniteNumber(base.defense, CONFIG.seal.defense, 0),
    carriedG: 0,
    exp: profile.exp,
    level: profile.level,
    favor: profile.favor,
    visits: profile.visits,
    state: 'arriving',
    minStayMs: CONFIG.visitor.minStayMs,
    maxStayMs: CONFIG.visitor.maxStayMs + favorBonus
  }, gameState.seals.length);
  visitor.hp = visitor.maxHp;
  gameState.seals.push(visitor);
  logMessage(`${visitor.name}が南の入口から歩いて訪れました。`);
  return visitor;
}

function spawnVisitor() {
  const entry = gatePointToWorld(gameState.gates?.entryGate);
  if (!entry) { logMessage('入口がないため、訪問者は来られません。'); return null; }
  return spawnVisitorFromProfile(chooseUnlockedVisitorProfile());
}

function writeBackVisitorProfile(seal) {
  if (seal?.type !== 'visitor') return;
  const profile = getVisitorProfileById(seal.profileId);
  if (!profile) return;
  profile.level = clampInteger(seal.level, 1, Number.MAX_SAFE_INTEGER, profile.level);
  profile.exp = safeFiniteNumber(seal.exp, profile.exp, 0);
  profile.favor = safeFiniteNumber(seal.favor, profile.favor, 0);
  profile.visits = Math.max(clampInteger(profile.visits, 0, Number.MAX_SAFE_INTEGER, 0), clampInteger(seal.visits, 0, Number.MAX_SAFE_INTEGER, 0));
  profile.personality = String(seal.personality || profile.personality || 'balanced');
  profile.baseStats = profile.baseStats ?? { maxHp: seal.maxHp, attack: seal.attack, defense: seal.defense };
}

function getPersonalityConfig(seal) {
  return CONFIG.personalities?.[seal?.personality] ?? CONFIG.personalities?.balanced;
}

function shouldContinueHunting(seal) {
  return !shouldReturnFromHunt(seal);
}

function shouldReturnFromHunt(seal) {
  const personality = getPersonalityConfig(seal);
  const hpRatio = seal?.maxHp > 0 ? seal.hp / seal.maxHp : 0;
  if (hpRatio <= personality.emergencyHpRatio) return true;
  const huntCount = clampInteger(seal?.huntCountThisTrip, 0, Number.MAX_SAFE_INTEGER, 0);
  if (huntCount >= personality.maxHuntsPerTrip) return true;
  const favorBonus = Math.min(CONFIG.seal.maxFavorHuntDurationBonus, safeFiniteNumber(seal?.favor, 0, 0) * CONFIG.seal.favorHuntDurationBonus);
  const durationLimit = CONFIG.seal.huntDurationLimit + (seal?.type === 'visitor' ? favorBonus : 0);
  if (safeFiniteNumber(seal?.huntTimer, 0, 0) >= durationLimit) return true;
  if (safeFiniteNumber(seal?.noMonsterTimer, 0, 0) >= CONFIG.seal.noMonsterExploreSeconds && huntCount > 0) return true;
  if (huntCount < personality.preferredMinHunts && hpRatio > personality.returnHpRatio) return false;
  if (hpRatio <= personality.returnHpRatio && Math.random() < personality.returnChance) return true;
  if (safeFiniteNumber(seal?.carriedG, 0, 0) >= CONFIG.seal.carriedGReturnThreshold && Math.random() < CONFIG.seal.carriedGReturnChance) return true;
  return false;
}

function chooseNextHuntTarget(seal) {
  const gate = selectedOrNearestHuntGate(seal);
  return claimNearestMonster(seal, gate?.areaId);
}

function chooseFacilityAfterHunt(seal) {
  return chooseFacilityForSeal(seal);
}

function updateSeals(dt) {
  ensureResidentSeal();
  for (const seal of [...(gameState.seals ?? [])]) {
    if (!seal) continue;
    if (seal.type === 'visitor') seal.visitTimerMs = safeFiniteNumber(seal.visitTimerMs, 0, 0) + dt * 1000;
    if (seal.state === 'fallen') { updateFallen(seal, dt); continue; }
    const fallen = findFallenForRescue(seal);
    if (fallen && !seal.rescueTargetId && seal.hp > seal.maxHp * CONFIG.seal.lowHpRatio) {
      seal.state = 'rescuing'; seal.rescueTargetId = fallen.id; seal.target = { x: fallen.x, y: fallen.y }; logMessage(`${seal.name}が${fallen.name}を救助に向かいました。`);
    }
    switch (seal.state) {
      case 'arriving': updateArriving(seal); break;
      case 'choosingHuntGate': updateChoosingHuntGate(seal); break;
      case 'movingToHuntGate': updateMovingToHuntGate(seal, dt); break;
      case 'hunting': updateHunting(seal, dt); break;
      case 'movingToMonster': updateMovingToMonster(seal, dt); break;
      case 'fighting': updateFighting(seal, dt); break;
      case 'returningFromHunt': updateReturningFromHunt(seal, dt); break;
      case 'choosingFacility': updateChoosingFacility(seal, dt); break;
      case 'movingToFacility': updateMovingToFacility(seal, dt); break;
      case 'usingFacility': updateUsingFacility(seal, dt); break;
      case 'leaving': updateLeaving(seal, dt); break;
      case 'resting': updateResting(seal, dt); break;
      case 'rescuing': updateRescuing(seal, dt); break;
      case 'carryingFallenSeal': updateCarrying(seal, dt); break;
      default: seal.state = seal.type === 'visitor' ? 'arriving' : 'choosingHuntGate'; seal.target = null; break;
    }
  }
}

function updateFallen(seal, dt) {
  seal.hp = Math.min(seal.maxHp, seal.hp + CONFIG.seal.fallenRecoveryPerSecond * dt);
  if (seal.hp >= seal.maxHp * CONFIG.seal.standHpRatio && !isBeingCarried(seal.id)) {
    seal.state = 'returningFromHunt';
    const gate = selectedOrNearestHuntGate(seal);
    seal.target = gatePointToWorld(gate?.outside) ?? gatePointToWorld(gate?.village) ?? villageWanderPoint();
    logMessage(`${seal.name}が自力で起き上がりました。`);
  }
}

function updateArriving(seal) {
  seal.leaveAfterFacilityUse = false;
  setSealTarget(seal, villageWanderPoint(), 'arriving');
  seal.wanderTimer = CONFIG.seal.wanderSeconds;
  seal.state = 'choosingFacility';
}

function updateChoosingHuntGate(seal) {
  const gate = nearestHuntGate(seal.x, seal.y);
  if (!gate) { warnNoHuntGate(seal); return; }
  seal.selectedHuntGateId = gate.id;
  setSealTarget(seal, gatePointToWorld(gate.village), 'hunt-gate-village');
  seal.targetId = null;
  seal.huntTimer = 0;
  seal.noMonsterTimer = 0;
  seal.huntCountThisTrip = 0;
  seal.state = 'movingToHuntGate';
}

function updateMovingToHuntGate(seal, dt) {
  const gate = selectedOrNearestHuntGate(seal);
  const villageSide = gatePointToWorld(gate?.village);
  const outsideSide = gatePointToWorld(gate?.outside);
  if (!gate || !villageSide || !outsideSide) { warnNoHuntGate(seal); return; }
  seal.selectedHuntGateId = gate.id;
  if (distance(seal.x, seal.y, villageSide.x, villageSide.y) > CONFIG.seal.contactDistance) {
    setSealTarget(seal, villageSide, 'hunt-gate-village');
    moveSealToward(seal, seal.target, dt);
    return;
  }
  setSealTarget(seal, outsideSide, 'hunt-gate-outside');
  moveSealToward(seal, outsideSide, dt);
  if (distance(seal.x, seal.y, outsideSide.x, outsideSide.y) > CONFIG.seal.contactDistance) return;
  setSealTarget(seal, randomHuntAreaPoint(gate.areaId), 'hunt-area');
  seal.state = 'hunting';
}

function updateHunting(seal, dt) {
  seal.huntTimer = safeFiniteNumber(seal.huntTimer, 0, 0) + dt;
  if (shouldReturnFromHunt(seal)) { sendSealBackThroughHuntGate(seal); return; }
  const gate = selectedOrNearestHuntGate(seal);
  const monster = chooseNextHuntTarget(seal);
  if (monster) { seal.noMonsterTimer = 0; seal.state = 'movingToMonster'; seal.targetId = monster.id; setSealTarget(seal, { x: monster.x, y: monster.y }, 'monster'); return; }
  seal.noMonsterTimer = safeFiniteNumber(seal.noMonsterTimer, 0, 0) + dt;
  seal.wanderTimer = Math.max(0, safeFiniteNumber(seal.wanderTimer, 0, 0) - dt);
  if (!seal.target || seal.wanderTimer <= 0 || distance(seal.x, seal.y, seal.target.x, seal.target.y) < CONFIG.seal.contactDistance) {
    setSealTarget(seal, randomHuntAreaPoint(gate?.areaId), 'hunt-wander');
    seal.wanderTimer = CONFIG.seal.wanderSeconds;
  }
  moveSealToward(seal, seal.target, dt);
}

function sendSealBackThroughHuntGate(seal) {
  const gate = selectedOrNearestHuntGate(seal);
  const outsideSide = gatePointToWorld(gate?.outside);
  const villageSide = gatePointToWorld(gate?.village);
  if (!gate || !outsideSide || !villageSide) { warnNoHuntGate(seal); return; }
  seal.selectedHuntGateId = gate.id;
  setSealTarget(seal, outsideSide, 'return-gate-outside');
  seal.state = 'returningFromHunt';
}

function claimNearestMonster(seal, areaId = null) {
  const available = (gameState.monsters ?? []).filter(m => m?.hp > 0 && (!areaId || (m?.areaId ?? 'coast') === areaId) && (!m.assignedSealId || m.assignedSealId === seal.id));
  const monster = available.reduce((best, m) => !best || distance(seal.x, seal.y, m.x, m.y) < distance(seal.x, seal.y, best.x, best.y) ? m : best, null);
  if (monster) monster.assignedSealId = seal.id;
  return monster;
}

function updateMovingToMonster(seal, dt) {
  const monster = (gameState.monsters ?? []).find(m => m?.id === seal.targetId);
  if (!monster || monster.hp <= 0) { seal.targetId = null; seal.state = 'hunting'; return; }
  if (shouldReturnFromHunt(seal)) { monster.assignedSealId = null; seal.targetId = null; sendSealBackThroughHuntGate(seal); return; }
  seal.target = { x: monster.x, y: monster.y };
  moveSealToward(seal, seal.target, dt);
  if (distance(seal.x, seal.y, monster.x, monster.y) <= CONFIG.monster.contactDistance) { seal.state = 'fighting'; seal.combatTimer = 0; seal.monsterTimer = 0; }
}

function updateFighting(seal, dt) {
  const monster = (gameState.monsters ?? []).find(m => m?.id === seal.targetId);
  if (!monster || monster.hp <= 0) { seal.targetId = null; if (seal.carriedG > 0) sendSealBackThroughHuntGate(seal); else seal.state = 'hunting'; return; }
  seal.combatTimer += dt; seal.monsterTimer += dt;
  if (seal.combatTimer >= CONFIG.combat.sealAttackSeconds) {
    seal.combatTimer = 0;
    monster.hp -= Math.max(CONFIG.combat.minDamage, seal.attack - monster.defense);
    if (monster.hp <= 0) {
      seal.exp += CONFIG.monster.rewardExp;
      seal.carriedG += CONFIG.monster.rewardG;
      addFavor(seal, CONFIG.seal.favorDefeat);
      seal.huntCountThisTrip = clampInteger(seal.huntCountThisTrip, 0, Number.MAX_SAFE_INTEGER, 0) + 1;
      if (seal.type === 'visitor') seal.huntsThisVisit = clampInteger(seal.huntsThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) + 1;
      gameState.stats.monthlyHunts = clampInteger(gameState.stats?.monthlyHunts, 0, Number.MAX_SAFE_INTEGER, 0) + 1;
      applyLevelUps(seal);
      gameState.frameTemps.toRemoveMonsters.push(monster.id);
      logMessage(`${seal.name}がカニを倒して${CONFIG.monster.rewardG}Gを獲得！`);
      seal.targetId = null;
      if (shouldContinueHunting(seal)) seal.state = 'hunting'; else sendSealBackThroughHuntGate(seal);
      return;
    }
  }
  if (seal.monsterTimer >= CONFIG.combat.monsterAttackSeconds) {
    seal.monsterTimer = 0;
    seal.hp -= Math.max(CONFIG.combat.minDamage, monster.attack - seal.defense);
    if (seal.hp <= 0) { seal.hp = 0; monster.assignedSealId = null; seal.state = 'fallen'; seal.targetId = null; seal.rescueTargetId = null; logMessage(`${seal.name}が倒れました。`); }
  }
}

function updateReturningFromHunt(seal, dt) {
  const gate = selectedOrNearestHuntGate(seal);
  const outsideSide = gatePointToWorld(gate?.outside);
  const villageSide = gatePointToWorld(gate?.village);
  if (!gate || !outsideSide || !villageSide) { warnNoHuntGate(seal); return; }
  if (distance(seal.x, seal.y, outsideSide.x, outsideSide.y) > CONFIG.seal.contactDistance) {
    setSealTarget(seal, outsideSide, 'return-gate-outside');
    moveSealToward(seal, outsideSide, dt);
    return;
  }
  setSealTarget(seal, villageSide, 'return-gate-village');
  moveSealToward(seal, villageSide, dt);
  if (distance(seal.x, seal.y, villageSide.x, villageSide.y) > CONFIG.seal.contactDistance) return;
  seal.target = null;
  seal.targetId = null;
  seal.state = 'choosingFacility';
}

function updateChoosingFacility(seal, dt) {
  if (seal.wanderTimer > 0) {
    seal.wanderTimer -= dt;
    if (!seal.target || distance(seal.x, seal.y, seal.target.x, seal.target.y) < CONFIG.seal.contactDistance) seal.target = villageWanderPoint();
    moveSealToward(seal, seal.target, dt);
    if (seal.wanderTimer > 0) return;
  }
  const facility = chooseFacilityAfterHunt(seal);
  if (!facility) { handleNoUsableFacility(seal); return; }
  seal.targetId = facility.id;
  setSealTarget(seal, centerOfObject(facility), 'facility');
  seal.state = 'movingToFacility';
}

function chooseFacilityForSeal(seal) {
  const hpRatio = seal.maxHp > 0 ? seal.hp / seal.maxHp : 0;
  const candidates = [];
  const inn = nearestFacility('inn', seal.x, seal.y);
  const restaurant = nearestFacility('restaurant', seal.x, seal.y);
  const blacksmith = nearestFacility('blacksmith', seal.x, seal.y);
  if (inn && seal.carriedG >= CONFIG.facilities.inn.fee) {
    let weight = CONFIG.seal.facilityChoiceWeights.inn;
    if (hpRatio <= CONFIG.seal.innHpThreshold) weight += CONFIG.seal.facilityChoiceWeights.inn;
    else if (hpRatio <= CONFIG.seal.mediumHpRatio && Math.random() < CONFIG.seal.mediumInnChance) weight += CONFIG.seal.facilityChoiceWeights.inn;
    if (seal.mealCountSinceInn >= CONFIG.seal.mealsBeforeInnSoftLimit) weight += CONFIG.seal.mealsInnChanceBoost;
    candidates.push({ facility: inn, weight });
  }
  if (seal.carriedG > 0 && hpRatio > CONFIG.seal.lowHpRatio) {
    if (restaurant) candidates.push({ facility: restaurant, weight: CONFIG.seal.facilityChoiceWeights.restaurant / (1 + (seal.facilityUseCounts?.restaurant ?? 0)) });
    if (blacksmith) candidates.push({ facility: blacksmith, weight: CONFIG.seal.facilityChoiceWeights.blacksmith / (1 + (seal.facilityUseCounts?.blacksmith ?? 0)) });
  }
  if (hpRatio <= CONFIG.seal.innHpThreshold && inn) return inn;
  return weightedFacility(candidates);
}

function weightedFacility(candidates) {
  const valid = (candidates ?? []).filter(item => item?.facility && isFacilityUsable(item.facility) && item.weight > 0);
  const total = valid.reduce((sum, item) => sum + item.weight, 0);
  let roll = Math.random() * Math.max(total, 1);
  for (const item of valid) {
    roll -= item.weight;
    if (roll <= 0) return item.facility;
  }
  return valid[0]?.facility ?? null;
}

function updateMovingToFacility(seal, dt) {
  const facility = (gameState.world.objects ?? []).find(o => o?.id === seal.targetId);
  if (!facility || !isFacilityUsable(facility)) { seal.targetId = null; seal.state = 'choosingFacility'; return; }
  const target = centerOfObject(facility);
  seal.target = target;
  moveSealToward(seal, target, dt);
  if (distance(seal.x, seal.y, target.x, target.y) <= CONFIG.seal.contactDistance) {
    seal.actionTimer = facility.type === 'inn' ? CONFIG.seal.restSeconds : CONFIG.seal.spendSeconds;
    seal.state = facility.type === 'inn' ? 'resting' : 'usingFacility';
  }
}

function updateUsingFacility(seal, dt) {
  const facility = (gameState.world.objects ?? []).find(o => o?.id === seal.targetId);
  if (!facility || !isFacilityUsable(facility)) { seal.targetId = null; seal.state = 'choosingFacility'; return; }
  seal.actionTimer -= dt;
  if (seal.actionTimer > 0) return;
  const base = CONFIG.facilities[facility.type]?.spendPerVisit ?? 0;
  const spent = Math.min(seal.carriedG, Math.round(base * (1 + facilityBonus(facility))));
  seal.carriedG -= spent;
  gameState.player.g += spent;
  seal.facilityUseCounts[facility.type] = (seal.facilityUseCounts?.[facility.type] ?? 0) + 1;
  if (facility.type === 'restaurant') seal.mealCountSinceInn += 1;
  if (seal.type === 'visitor') seal.facilitiesUsedThisVisit = clampInteger(seal.facilitiesUsedThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) + 1;
  if (facility.type === 'blacksmith' && Math.random() < CONFIG.seal.blacksmithAttackChance) seal.attack += CONFIG.seal.blacksmithAttackGain;
  addFavor(seal, CONFIG.seal.favorFacilityUse);
  logMessage(`${seal.name}が${CONFIG.facilities[facility.type]?.label}で${spent}G使いました。`);
  afterVillageActivity(seal);
}

function updateResting(seal, dt) {
  const inn = (gameState.world.objects ?? []).find(o => o?.id === seal.targetId);
  if (!inn || !isFacilityUsable(inn)) { seal.targetId = null; seal.state = 'choosingFacility'; return; }
  const bonus = facilityBonus(inn);
  seal.hp = Math.min(seal.maxHp, seal.hp + CONFIG.facilities.inn.healPerSecond * (1 + bonus) * dt);
  seal.actionTimer -= dt;
  if (seal.hp >= seal.maxHp * CONFIG.seal.restTargetRatio && seal.actionTimer <= 0) {
    const fee = Math.min(seal.carriedG, CONFIG.facilities.inn.fee);
    seal.carriedG -= fee;
    gameState.player.g += fee;
    seal.facilityUseCounts.inn = (seal.facilityUseCounts?.inn ?? 0) + 1;
    seal.mealCountSinceInn = 0;
    if (seal.type === 'visitor') seal.facilitiesUsedThisVisit = clampInteger(seal.facilitiesUsedThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) + 1;
    addFavor(seal, CONFIG.seal.favorFacilityUse);
    logMessage(`${seal.name}が宿屋で回復し、${fee}G支払いました。`);
    afterVillageActivity(seal);
  }
}

function handleNoUsableFacility(seal) {
  if (seal?.type === 'visitor') { afterVillageActivity(seal); return; }
  const hpRatio = seal.maxHp > 0 ? seal.hp / seal.maxHp : 0;
  if (hpRatio <= CONFIG.seal.lowHpRatio) {
    seal.wanderTimer = CONFIG.seal.wanderSeconds;
    setSealTarget(seal, villageWanderPoint(), 'village-wander');
    seal.state = 'choosingFacility';
    return;
  }
  seal.state = 'choosingHuntGate';
}

function visitorShouldLeave(seal) {
  if (seal?.type !== 'visitor') return false;
  const personality = getPersonalityConfig(seal);
  const hpRatio = seal.maxHp > 0 ? seal.hp / seal.maxHp : 0;
  if (hpRatio <= personality.emergencyHpRatio) return true;
  const stayedMin = safeFiniteNumber(seal.visitTimerMs, 0, 0) >= safeFiniteNumber(seal.minStayMs, CONFIG.visitor.minStayMs, 0);
  const reachedMax = safeFiniteNumber(seal.visitTimerMs, 0, 0) >= safeFiniteNumber(seal.maxStayMs, CONFIG.visitor.maxStayMs, 0);
  const satisfied = clampInteger(seal.facilitiesUsedThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) >= CONFIG.visitor.satisfyingMinFacilities
    || clampInteger(seal.huntsThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) >= CONFIG.visitor.enoughHuntsForLeave;
  return reachedMax || (stayedMin && (satisfied || seal.wantsToLeave));
}

function afterVillageActivity(seal) {
  seal.targetId = null;
  seal.target = null;
  seal.path = [];
  if (seal?.type === 'visitor') {
    seal.wantsToLeave = visitorShouldLeave(seal);
    if (seal.wantsToLeave) {
      seal.state = 'leaving';
      setSealTarget(seal, gatePointToWorld(gameState.gates?.entryGate) ?? villageWanderPoint(), 'leave-entry');
      return;
    }
    seal.wanderTimer = CONFIG.seal.wanderSeconds;
    setSealTarget(seal, villageWanderPoint(), 'visitor-stay');
    seal.state = 'choosingFacility';
    return;
  }
  seal.state = 'choosingHuntGate';
}

function updateLeaving(seal, dt) {
  const entry = gatePointToWorld(gameState.gates?.entryGate);
  if (!entry) { persistAndRemoveVisitor(seal); return; }
  setSealTarget(seal, entry, 'leave-entry');
  moveSealToward(seal, entry, dt);
  if (distance(seal.x, seal.y, entry.x, entry.y) > CONFIG.seal.contactDistance) return;
  addFavor(seal, CONFIG.visitor.safeLeaveFavor);
  if (clampInteger(seal.facilitiesUsedThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) >= CONFIG.visitor.satisfyingMinFacilities || clampInteger(seal.huntsThisVisit, 0, Number.MAX_SAFE_INTEGER, 0) >= CONFIG.visitor.satisfyingMinHunts) {
    addFavor(seal, CONFIG.knownness.satisfyingVisitReward);
    gameState.village.knownness += CONFIG.knownness.satisfyingVisitReward;
    unlockKnownVisitors();
  }
  writeBackVisitorProfile(seal);
  persistAndRemoveVisitor(seal);
}

function persistAndRemoveVisitor(seal) {
  if (seal?.type !== 'visitor') return;
  writeBackVisitorProfile(seal);
  logMessage(`${seal.name}が南の入口門から帰りました。`);
  gameState.seals = (gameState.seals ?? []).filter(item => item?.id !== seal.id);
}

function addFavor(seal, amount) {
  if (!seal || !Number.isFinite(Number(amount))) return;
  seal.favor = safeFiniteNumber(seal.favor, 0, 0) + amount;
}

function applyLevelUps(seal) {
  while (seal.exp >= seal.level * CONFIG.seal.levelExp) {
    seal.level += 1;
    seal.maxHp += CONFIG.seal.levelHpGain;
    seal.attack += CONFIG.seal.levelAttackGain;
    seal.hp = seal.maxHp;
    addFavor(seal, CONFIG.seal.favorLevelUp);
    logMessage(`${seal.name}がLv.${seal.level}になりました！`);
  }
}

function findFallenForRescue(seal) {
  return (gameState.seals ?? []).find(other => other?.id !== seal.id && other?.state === 'fallen' && !isBeingCarried(other.id) && distance(seal.x, seal.y, other.x, other.y) <= CONFIG.seal.rescueScanDistance);
}

function isBeingCarried(sealId) { return (gameState.seals ?? []).some(s => s?.rescueTargetId === sealId && s?.state === 'carryingFallenSeal'); }

function updateRescuing(seal, dt) {
  const fallen = (gameState.seals ?? []).find(s => s?.id === seal.rescueTargetId);
  if (!fallen || fallen.state !== 'fallen') { seal.rescueTargetId = null; seal.state = 'choosingHuntGate'; return; }
  moveSealToward(seal, { x: fallen.x, y: fallen.y }, dt);
  if (distance(seal.x, seal.y, fallen.x, fallen.y) <= CONFIG.seal.contactDistance) {
    seal.state = 'carryingFallenSeal';
    const inn = nearestFacility('inn', seal.x, seal.y);
    seal.targetId = inn?.id ?? null;
    seal.target = inn ? centerOfObject(inn) : (gatePointToWorld(selectedOrNearestHuntGate(seal)?.village) ?? villageWanderPoint());
  }
}

function updateCarrying(seal, dt) {
  const fallen = (gameState.seals ?? []).find(s => s?.id === seal.rescueTargetId);
  if (!fallen) { seal.rescueTargetId = null; seal.state = 'choosingHuntGate'; return; }
  moveSealToward(seal, seal.target, dt);
  fallen.x = seal.x - CONFIG.seal.spread * 0.5; fallen.y = seal.y;
  if (distance(seal.x, seal.y, seal.target?.x, seal.target?.y) > CONFIG.seal.contactDistance) return;
  const inn = (gameState.world.objects ?? []).find(o => o?.id === seal.targetId);
  if (inn && isFacilityUsable(inn)) {
    const fee = CONFIG.facilities.inn.fee;
    const paidByFallen = Math.min(fallen.carriedG, fee);
    fallen.carriedG -= paidByFallen;
    const paidByRescuer = Math.min(seal.carriedG, fee - paidByFallen);
    seal.carriedG -= paidByRescuer;
    gameState.player.g += paidByFallen + paidByRescuer;
    fallen.hp = Math.min(fallen.maxHp, fallen.maxHp * CONFIG.seal.restTargetRatio);
    addFavor(fallen, CONFIG.seal.favorRescued);
    logMessage(`宿代${paidByFallen + paidByRescuer}G支払い、${fallen.name}を救助しました。`);
  } else {
    fallen.hp = Math.max(fallen.hp, fallen.maxHp * CONFIG.seal.standHpRatio);
    addFavor(fallen, CONFIG.seal.favorRescued);
    logMessage(`${fallen.name}を安全地点へ運びました。`);
  }
  fallen.state = 'choosingFacility';
  fallen.target = null;
  seal.rescueTargetId = null;
  seal.state = 'choosingFacility';
  seal.target = null;
}

function setSealTarget(seal, target, reason) {
  if (!seal) return;
  if (!target || !Number.isFinite(Number(target.x)) || !Number.isFinite(Number(target.y))) { seal.target = null; seal.path = []; seal.pathTargetKey = null; return; }
  const next = { x: safeFiniteNumber(target.x, seal.x), y: safeFiniteNumber(target.y, seal.y), reason: String(reason ?? '') };
  const key = `${worldToGrid(next.x, next.y).x},${worldToGrid(next.x, next.y).y}:${next.reason}`;
  seal.target = next;
  if (seal.pathTargetKey === key && Array.isArray(seal.path)) return;
  const path = findPath(worldToGrid(seal.x, seal.y), worldToGrid(next.x, next.y), seal);
  seal.path = Array.isArray(path) ? path.map(tile => gridToWorld(tile.x, tile.y)) : [];
  seal.pathTargetKey = key;
  if ((!seal.path || seal.path.length <= 0) && !seal.warnedPathFallback) {
    seal.warnedPathFallback = true;
    logMessage(`${seal.name}は道順が見つからず直進します。`);
  }
}

function findPath(startTile, goalTile, seal = null) {
  const start = { x: clampInteger(startTile?.x, 0, CONFIG.world.cols - 1, 0), y: clampInteger(startTile?.y, 0, CONFIG.world.rows - 1, 0) };
  const goal = { x: clampInteger(goalTile?.x, 0, CONFIG.world.cols - 1, 0), y: clampInteger(goalTile?.y, 0, CONFIG.world.rows - 1, 0) };
  if (start.x === goal.x && start.y === goal.y) return [];
  const open = [{ ...start, g: 0, f: distance(start.x, start.y, goal.x, goal.y) }];
  const came = new Map();
  const cost = new Map([[`${start.x},${start.y}`, 0]]);
  const closed = new Set();
  let visited = 0;
  while (open.length > 0 && visited < CONFIG.movement.maxPathNodes) {
    open.sort((a, b) => a.f - b.f);
    const current = open.shift();
    const currentKey = `${current.x},${current.y}`;
    if (closed.has(currentKey)) continue;
    closed.add(currentKey);
    visited += 1;
    if (current.x === goal.x && current.y === goal.y) return rebuildPath(came, start, goal);
    for (const dir of CONFIG.directions) {
      const next = { x: current.x + dir.dx, y: current.y + dir.dy };
      const moveCost = getTileMoveCost(next, seal);
      if (!Number.isFinite(moveCost)) continue;
      const nextKey = `${next.x},${next.y}`;
      const nextCost = (cost.get(currentKey) ?? 0) + moveCost;
      if (nextCost >= (cost.get(nextKey) ?? Infinity)) continue;
      came.set(nextKey, currentKey);
      cost.set(nextKey, nextCost);
      open.push({ ...next, g: nextCost, f: nextCost + distance(next.x, next.y, goal.x, goal.y) });
    }
  }
  return [];
}

function rebuildPath(came, start, goal) {
  const path = [];
  let key = `${goal.x},${goal.y}`;
  const startKey = `${start.x},${start.y}`;
  while (key !== startKey && came.has(key)) {
    const [x, y] = key.split(',').map(Number);
    path.unshift({ x, y });
    key = came.get(key);
  }
  return path;
}

function getTileMoveCost(tile, seal = null) {
  const x = clampInteger(tile?.x, 0, CONFIG.world.cols - 1, -1);
  const y = clampInteger(tile?.y, 0, CONFIG.world.rows - 1, -1);
  const cell = getTile(x, y);
  if (!cell) return Infinity;
  if (isGateTile(x, y)) return CONFIG.movement.gateCost;
  if (roadAt(x, y)) return CONFIG.movement.roadCost;
  if (cell.terrain === CONFIG.tileState.terrainWater) return Infinity;
  if (cell.terrain === CONFIG.tileState.terrainOutside) return CONFIG.movement.outsideCost;
  if (cell.terrain === CONFIG.tileState.terrainLand && cell.buildState === CONFIG.tileState.buildable && cell.obstacle === null) return CONFIG.movement.buildableCost;
  return Infinity;
}

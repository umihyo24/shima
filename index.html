<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seal Island Economy Adventure</title>
  <link rel="stylesheet" href="css/style.css" />

</head>
<body>
  <canvas id="game" aria-label="ゲームキャンバス"></canvas>

  <div class="topHud hud" aria-label="常時表示HUD">
    <div class="panel stats compactHud" id="stats"></div>
  </div>

  <div class="panel speedHud speed-panel" id="speedHud" aria-label="速度操作"></div>

  <div class="managementButtons panel" id="managementButtons" aria-label="管理パネル"></div>

  <div class="managementPanel panel" id="managementPanel" aria-label="管理パネル内容" hidden></div>

  <div class="bottomUi bottom-ui" id="bottomUi" aria-label="建設UI">
    <div class="bottomPanel bottom-panel bottom-panel-shell buildDrawer" id="bottomPanel" hidden></div>
    <div class="bottomTabBar bottom-tabs bottom-tab-bar buildBar" id="bottomTabBar"></div>
  </div>

  <div class="start" id="startScreen">
    <div class="panel startCard">
      <h1>あざらし島の冒険経済</h1>
      <p>同じ世界マップ上にある島と外海を眺めながら、道路や施設を配置しましょう。あざらしたちは外でカニと戦い、Gを持ち帰り、施設で使い、倒れた仲間を救助し続けます。</p>
      <div class="startActions">
        <button id="startBtn">新しく始める</button>
        <button id="loadBtn" hidden>続きから</button>
      </div>
      <div class="saveInfo" id="startSaveInfo">セーブデータを確認中...</div>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/state.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/update.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>

</body>
</html>
